name: Release plugin

# Publishes a GitHub Release for the tag of one plugin: plugin/<id>/v1.2.0 is a
# stable release, plugin/<id>/v1.2.0-beta.1 a beta, plugin/<id>/v1.2.0-alpha.1
# an alpha (there is no dev channel: internal builds live in the development
# repository). It runs when such a tag is pushed, or when "Release a plugin"
# (publish-plugin.yml) starts it on the tag it made.
#
# Three jobs, as in Regulus' release.yml, so that what runs the build cannot
# publish:
#   verify   read-only: the tag, the commit (on main, CI green), the manifest,
#            the CHANGELOG notes and the order of the version are all checked
#            before anything is built
#   build    read-only: packs the plugin for linux amd64 and arm64 and writes
#            the checksums. It runs the plugin's own build, which is why it has
#            no write permission and no id-token
#   publish  runs no build: it checks the files against checksums.txt, attests
#            their provenance and creates the release. It is the only job that
#            can write, and it needs the `plugin-release` environment
#
# A plugin that has no program for a command of its manifest is refused by the
# build (scripts/package-plugin.sh): a package Regulus cannot start must never
# reach the index. The index is not made here: the last job asks
# publish-index.yml for a new one, which signs it.
#
# The environment `plugin-release` (required reviewers; deployment only from
# `plugin/*` tags) is a repository setting that must be created by a
# maintainer: Stellatinus/Regulus-Plugins#7. Without it the environment name
# changes nothing. So is "who may create plugin/* tags" (a tag ruleset).
on:
  push:
    tags: ["plugin/*/v*"]
  workflow_dispatch:

# No permission at all unless a job asks for it.
permissions: {}

jobs:
  verify:
    name: Verify the tag and the commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/plugin/')
    permissions:
      contents: read
      actions: read # to read the result of CI on this commit
    outputs:
      id: ${{ steps.tag.outputs.id }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every branch (is the commit on main?) and every tag (is the version the next one?)
          persist-credentials: false
      - name: The tag is plugin/<id>/v<version>
        id: tag
        run: |
          set -eu
          tag=$GITHUB_REF_NAME
          case "$tag" in
            plugin/*/v*) ;;
            *) echo "::error::$tag is not plugin/<id>/v<version>"; exit 1 ;;
          esac
          rest=${tag#plugin/}
          id=${rest%%/*}
          version=${rest#*/v}
          printf '%s\n' "$id" | grep -Eq '^[a-z][a-z0-9]*(-[a-z0-9]+)*$' || { echo "::error::'$id' is not a plugin id"; exit 1; }
          [ -d "plugins/$id" ] || { echo "::error::there is no plugins/$id at this commit"; exit 1; }
          echo "id=$id" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"
      # A tag pushed by hand skips publish-plugin.yml, so the checks are
      # repeated here. They are not the whole protection: the workflow that runs
      # is the one at the tagged commit, so whoever can push a tag can also
      # remove these steps. What stops that is who may create `plugin/*` tags
      # and who may approve the environment (README.md).
      - name: Only a commit on main whose CI is green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git rev-parse --verify -q refs/remotes/origin/main >/dev/null || { echo "::error::main was not fetched"; exit 1; }
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::${GITHUB_REF_NAME} is on ${GITHUB_SHA}, which is not on main. Releases are made from main only."
            exit 1
          fi
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=1" --jq '.workflow_runs[0] // {} | (.status // "") + " " + (.conclusion // "")')
          if [ "$run" != "completed success" ]; then
            echo "::error::CI has not passed on ${GITHUB_SHA} (${run:-no run}). Releases are made from a commit with green CI."
            exit 1
          fi
          echo "${GITHUB_SHA} is on main and CI passed."
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: tools/pluginctl/go.mod
          cache-dependency-path: tools/pluginctl/go.sum
      - name: The manifest says this version, and the CHANGELOG has notes for it
        env:
          ID: ${{ steps.tag.outputs.id }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -eu
          (cd tools/pluginctl && go build -o "$RUNNER_TEMP/pluginctl" .)
          "$RUNNER_TEMP/pluginctl" check -release "$VERSION" "plugins/$ID"
      - name: The version is the next one of its channel
        env:
          ID: ${{ steps.tag.outputs.id }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: git tag -l "plugin/$ID/v*" | sh scripts/plugin-version.sh check "$ID" "$VERSION"

  build:
    name: Build the packages
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.24" # the plugin's go.mod names the toolchain it needs, and Go fetches it
          cache: false
      - name: Pack the plugin for linux amd64 and arm64, and write the checksums
        env:
          ID: ${{ needs.verify.outputs.id }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -eu
          mkdir release
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch sh scripts/package-plugin.sh "plugins/$ID" release
          done
          (cd tools/pluginctl && go build -o "$RUNNER_TEMP/pluginctl" .)
          "$RUNNER_TEMP/pluginctl" notes "plugins/$ID" "$VERSION" >release/NOTES.md
          (cd release && sha256sum -- *.tar.gz >checksums.txt)
          ls -l release
          cat release/checksums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Protection rules of this environment (required reviewers, only plugin/*
    # tags) are repository settings; without them it changes nothing.
    environment: plugin-release
    permissions:
      contents: write # create the release and upload its files
      id-token: write # the provenance is signed with Sigstore
      attestations: write # build provenance of the packages
    steps:
      # The download is checked against the digest of the upload (the action
      # fails on a mismatch). No checkout and no build in this job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release
      - name: Check the files against checksums.txt
        working-directory: release
        run: |
          set -eu
          sha256sum --check --strict checksums.txt
          # Every package is in checksums.txt, and its own .sha256 says the same.
          for f in *.tar.gz; do
            grep -q -- "  $f\$" checksums.txt || { echo "::error::$f is not listed in checksums.txt"; exit 1; }
            grep -Fxf "$f.sha256" checksums.txt >/dev/null || { echo "::error::$f.sha256 differs from checksums.txt"; exit 1; }
          done
      - name: Attest the build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.tar.gz
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ID: ${{ needs.verify.outputs.id }}
          VERSION: ${{ needs.verify.outputs.version }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -eu
          cp "$BUNDLE" "release/${ID}_${VERSION}_provenance.sigstore.json"
          # alpha, beta and the like are pre-releases. No plugin release is
          # GitHub's "Latest" of the repository: that word means nothing here.
          case "$VERSION" in
            *-*) kind=--prerelease ;;
            *) kind= ;;
          esac
          cd release
          files=()
          for f in *; do
            [ "$f" = NOTES.md ] || files+=("$f")
          done
          # No checkout in this job, so name the repository for gh (Regulus #364).
          # shellcheck disable=SC2086
          gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$ID $VERSION" --notes-file NOTES.md --latest=false $kind

  refresh-index:
    name: Ask for a new index
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # start publish-index.yml
    steps:
      # A release made with the workflow token starts no other workflow, so
      # the index workflow is started explicitly, on main.
      - name: Start publish-index.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-index.yml --ref main --repo "$GITHUB_REPOSITORY"
